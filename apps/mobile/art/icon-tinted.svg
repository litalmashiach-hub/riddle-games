<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Tinted home screen icon (iOS 18 and later). The same art as apps/web/public/icons/icon.svg in shades
       of grey on black: iOS reads it by brightness and colours it with the player's chosen tint, so the
       brightest part, the question mark, takes the tint most strongly, and the hills and water stay dim. -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.45">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9d9d9"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="#000"/>
  <circle cx="512" cy="430" r="460" fill="url(#glow)"/>
  <g fill="#fff">
    <circle cx="170" cy="170" r="9" opacity="0.7"/><circle cx="860" cy="150" r="11" opacity="0.8"/><circle cx="790" cy="300" r="6" opacity="0.5"/>
    <circle cx="240" cy="330" r="6" opacity="0.5"/><circle cx="120" cy="470" r="7" opacity="0.45"/><circle cx="900" cy="470" r="7" opacity="0.45"/>
    <path d="M820 220 l14 34 34 14 -34 14 -14 34 -14 -34 -34 -14 34 -14z" opacity="0.85"/>
    <path d="M200 230 l10 24 24 10 -24 10 -10 24 -10 -24 -24 -10 24 -10z" opacity="0.85"/>
  </g>
  <path d="M0 790 C 180 690 340 700 520 770 C 700 840 860 720 1024 700 V1024 H0z" fill="#4a4a4a"/>
  <path d="M0 860 C 220 790 420 800 560 850 C 760 920 900 840 1024 830 V1024 H0z" fill="#2c2c2c"/>
  <path d="M120 900 q40 -14 80 0 M640 950 q40 -14 80 0 M380 975 q30 -10 60 0" stroke="#7a7a7a" stroke-width="10" stroke-linecap="round" fill="none"/>
  <g transform="translate(0,-20)">
    <path d="M352 360 a160 160 0 1 1 236 140 c-46 26 -66 46 -66 110" fill="none" stroke="#000" stroke-opacity="0.6" stroke-width="128" stroke-linecap="round" transform="translate(0,18)"/>
    <path d="M352 360 a160 160 0 1 1 236 140 c-46 26 -66 46 -66 110" fill="none" stroke="url(#mark)" stroke-width="150" stroke-linecap="round"/>
    <circle cx="522" cy="760" r="75" fill="url(#mark)"/>
  </g>
</svg>
