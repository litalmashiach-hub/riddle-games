name: TestFlight upload

# Builds the store version of the iPhone/iPad app on a hosted Mac, signs it with the owner's Apple team through an
# App Store Connect API key, and uploads it to TestFlight. Run by hand: Actions, "TestFlight upload", Run workflow.
# See docs/ios-app.md ("Upload to TestFlight") and docs/launch-steps.md for the whole way to the App Store.
#
# Nothing here holds a key, a certificate or a team. The owner adds them in the repository's settings:
#   variables  APP_BUNDLE_ID, APPLE_TEAM_ID (or APPLE_TEAM_ID as a secret), optional BUILD_NUMBER_OFFSET
#   secrets    APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY (the .p8 file's text)
# With any of them missing, a run by hand stops at its first step and names what to add.
#
# On a pull request that changes this workflow or its check script it runs in check mode: it reports what is
# missing without failing, builds and tests everything with RELEASE=1, and archives the app unsigned, stopping
# just before signing. A pull request never signs or uploads, and gets no secrets.

on:
  workflow_dispatch:
    inputs:
      check_only:
        description: "Check mode: build and archive unsigned, stop before signing, send nothing to Apple"
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/testflight.yml
      - apps/mobile/scripts/testflight-preflight.sh

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT: apps/mobile/ios/App/App.xcodeproj
  IDENTITY: apps/mobile/ios/AppIdentity.xcconfig
  ARCHIVE: build/testflight/App.xcarchive
  EXPORT: build/testflight/export
  # Store builds must set RELEASE=1: the About screen's placeholder guard then fails the tests and the build while
  # the contact, publisher or policy date is still empty, where without it it only warns.
  RELEASE: "1"
  CHECK_ONLY: ${{ github.event_name == 'pull_request' || inputs.check_only == true }}

jobs:
  testflight:
    # Capacitor 8 needs Xcode 26 or newer, and Apple takes uploads only from Xcode 26 and the iOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check that everything the upload needs is set
        id: preflight
        env:
          APP_BUNDLE_ID_VAR: ${{ vars.APP_BUNDLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          set -o pipefail
          if apps/mobile/scripts/testflight-preflight.sh | tee "$RUNNER_TEMP/preflight.txt"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            grep '^BUNDLE_ID=' "$RUNNER_TEMP/preflight.txt" | sed 's/^BUNDLE_ID=/bundle=/' >> "$GITHUB_OUTPUT"
          elif [ "$CHECK_ONLY" = "true" ]; then
            echo "::warning title=Check mode::Not ready to upload (see the list above). Going on anyway, to build everything up to signing. Nothing will be signed or sent."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Set the bundle identifier and a new build number
        env:
          BUNDLE: ${{ steps.preflight.outputs.bundle }}
          OFFSET: ${{ vars.BUILD_NUMBER_OFFSET || '0' }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Only this runner's copy of the file changes; nothing is committed.
          if [ -n "$BUNDLE" ]; then
            sed -i '' "s/^APP_BUNDLE_ID = .*/APP_BUNDLE_ID = $BUNDLE/" "$IDENTITY"
          fi
          # Every run gets a higher build number than the one before, as App Store Connect requires.
          BUILD=$(( OFFSET + RUN_NUMBER ))
          sed -i '' "s/^APP_BUILD = .*/APP_BUILD = $BUILD/" "$IDENTITY"
          grep -E '^APP_(BUNDLE_ID|DISPLAY_NAME|VERSION|BUILD) =' "$IDENTITY"
          echo "BUNDLE_ID=$(sed -n 's/^APP_BUNDLE_ID = //p' "$IDENTITY")" >> "$GITHUB_ENV"
          echo "APP_VERSION=$(sed -n 's/^APP_VERSION = //p' "$IDENTITY")" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"

      - name: Test the game (RELEASE=1)
        run: pnpm test

      - name: Build the app content and sync Capacitor (RELEASE=1)
        run: pnpm ios:sync

      - name: The app content has no service worker
        run: |
          test -f apps/mobile/ios/App/App/public/index.html
          test ! -e apps/mobile/ios/App/App/public/sw.js
          if grep -rl "sw.js" apps/mobile/ios/App/App/public; then echo "The app content still registers a service worker"; exit 1; fi

      - name: Xcode on this runner
        run: xcodebuild -version

      # ── Check mode: stop just before signing ────────────────────────────────────────────────────────────────
      - name: Archive for the App Store, unsigned (check mode)
        if: env.CHECK_ONLY == 'true'
        run: |
          set -o pipefail
          xcodebuild -project "$PROJECT" -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | tail -n 40

      - name: Check the archive (check mode)
        if: env.CHECK_ONLY == 'true'
        run: |
          PLIST="$ARCHIVE/Products/Applications/App.app/Info.plist"
          test -f "$PLIST"
          for key in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion ITSAppUsesNonExemptEncryption; do
            echo "$key: $(/usr/libexec/PlistBuddy -c "Print :$key" "$PLIST")"
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" = "$BUILD_NUMBER"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = "$BUNDLE_ID"
          test -f "$ARCHIVE/Products/Applications/App.app/PrivacyInfo.xcprivacy"
          {
            echo "### Check mode: stopped before signing"
            echo "Built, tested with RELEASE=1 and archived for the App Store, unsigned: version $APP_VERSION, build $BUILD_NUMBER, bundle identifier $BUNDLE_ID."
            echo "A run by hand with the secrets set goes on from here: it signs with your Apple team and uploads to TestFlight."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Stopped before signing. Nothing was signed or sent to Apple."

      # ── Signing and upload: only by hand, with everything set ───────────────────────────────────────────────
      - name: Put the API key and a temporary keychain on the runner
        if: env.CHECK_ONLY != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          KEY_DIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_DIR/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$KEY_DIR/AuthKey_$ASC_KEY_ID.p8"
          echo "KEY_PATH=$KEY_DIR/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
          # Xcode keeps the signing certificate it gets for this run in a keychain that exists only for this run.
          KEYCHAIN="$RUNNER_TEMP/testflight.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$KEYCHAIN"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Archive for the App Store, signed by your team
        if: env.CHECK_ONLY != 'true'
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -project "$PROJECT" -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            archive | tail -n 60

      - name: Export for the App Store and upload to TestFlight
        if: env.CHECK_ONLY != 'true'
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$ARCHIVE" -exportPath "$EXPORT" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -n 60
          {
            echo "### Uploaded to App Store Connect"
            echo "Version $APP_VERSION, build $BUILD_NUMBER, bundle identifier $BUNDLE_ID."
            echo "Apple processes it for a few minutes to an hour; it then shows in App Store Connect under the app, TestFlight."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the API key and the keychain
        if: always() && env.CHECK_ONLY != 'true'
        run: |
          rm -rf "$RUNNER_TEMP/private_keys"
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi

      - name: Keep Xcode's export logs if the upload failed
        if: failure() && env.CHECK_ONLY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: testflight-export-logs
          path: |
            ${{ env.EXPORT }}/*.log
            ${{ env.EXPORT }}/*.plist
          if-no-files-found: ignore
