name: Simulator play (test only)

# TEST ONLY, not for merging. Builds the iPhone/iPad app unsigned for the simulator on a hosted Mac
# and plays it by taps with a UI test (apps/mobile/ios/PlayTest). No signing, no secrets, nothing uploaded
# except the run's own artifact.

on:
  push:
    branches: [simulator-play-test]

permissions:
  contents: read

concurrency:
  group: ios-play-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: apps/mobile/ios/App/App.xcodeproj
  DERIVED: build/ios

jobs:
  play:
    runs-on: macos-26
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Xcode, Mac and simulators on this runner
        run: |
          xcodebuild -version
          sw_vers
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          system_profiler SPDisplaysDataType | head -n 20 || true
          xcrun simctl list devices available

      - name: Build the UI test (made with XcodeGen)
        run: |
          set -o pipefail
          which xcodegen || brew install xcodegen
          cd apps/mobile/ios/PlayTest
          xcodegen generate
          xcodebuild build-for-testing -project PlayTest.xcodeproj -scheme PlayTest \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/playtest" 2>&1 | tail -n 40

      - name: Build the app content and sync Capacitor
        run: pnpm ios:sync

      - name: Build the app for the simulator (Release)
        run: |
          set -o pipefail
          xcodebuild -project "$PROJECT" -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO build | tail -n 15

      - name: Build the app for the simulator (Debug)
        run: |
          set -o pipefail
          xcodebuild -project "$PROJECT" -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO build | tail -n 15

      - name: Play in an iPhone simulator (Release build)
        timeout-minutes: 25
        run: apps/mobile/ios/PlayTest/play.sh "iPhone 17 Pro Max" iphone release 99 2

      - name: Play in an iPad simulator (Release build)
        if: always()
        timeout-minutes: 25
        run: apps/mobile/ios/PlayTest/play.sh "iPad Pro 13-inch (M5)" ipad release 99 0

      - name: Play level 1 in the iPhone simulator with the Debug build, to read the web view's console
        if: always()
        timeout-minutes: 15
        run: apps/mobile/ios/PlayTest/play.sh "iPhone 17 Pro Max" iphone-console debug-console 1 0

      # Small copies of the pictures go into the log as text, for readers who can open a run's log
      # but cannot download its artifacts.
      - name: Pictures, in the log
        if: always()
        run: |
          cd out
          for f in */shots/*.png; do
            [ -f "$f" ] || continue
            sips -s format jpeg -s formatOptions 62 -Z 1500 "$f" --out "$RUNNER_TEMP/p.jpg" > /dev/null
            echo "-----BEGIN PICTURE $f-----"
            base64 -i "$RUNNER_TEMP/p.jpg" | fold -w 160
            echo "-----END PICTURE-----"
          done
          for f in */frames/*/*.jpg; do
            [ -f "$f" ] || continue
            sips -s format jpeg -s formatOptions 45 -Z 420 "$f" --out "$RUNNER_TEMP/p.jpg" > /dev/null
            echo "-----BEGIN PICTURE $f-----"
            base64 -i "$RUNNER_TEMP/p.jpg" | fold -w 160
            echo "-----END PICTURE-----"
          done
          for f in */frames/*/launch-time.txt; do echo "LAUNCHTIME $f $(cat "$f")"; done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-play
          path: |
            out/*/shots
            out/*/frames
            out/*/console.txt
            out/*/unified.txt
            out/*/xcodebuild.log
          if-no-files-found: warn

      - name: Did the taps win level 1 in each simulator?
        if: always()
        run: |
          cat out/*/status
          for s in out/iphone/status out/ipad/status out/iphone-console/status; do
            [ "$(cat "$s" 2> /dev/null)" = "0" ] || { echo "$s is not 0"; exit 1; }
          done
