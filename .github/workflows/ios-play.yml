name: Simulator play (test only)

# TEST ONLY, not for merging. Builds the iPhone/iPad app unsigned for the simulator on a hosted Mac
# and plays it by taps with a UI test (apps/mobile/ios/PlayTest). No signing, no secrets, nothing uploaded
# except the run's own artifact.

on:
  push:
    branches: [simulator-play-test]

permissions:
  contents: read

concurrency:
  group: ios-play-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: apps/mobile/ios/App/App.xcodeproj
  DERIVED: build/ios

jobs:
  play:
    name: ${{ matrix.label }}
    runs-on: macos-26
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: iphone, sim: "iPhone 17 Pro Max", mode: release, levels: 99, quality_tap: 2 }
          - { label: ipad, sim: "iPad Pro 13-inch (M5)", mode: release, levels: 2, quality_tap: 0 }
          - { label: ipad-sd, sim: "iPad Pro 13-inch (M5)", mode: release, levels: 3, quality_tap: 1 }
          - { label: iphone-console, sim: "iPhone 17 Pro Max", mode: debug-console, levels: 1, quality_tap: 0 }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Xcode, Mac and simulators on this runner
        run: |
          xcodebuild -version
          sw_vers
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          system_profiler SPDisplaysDataType | head -n 20 || true
          xcrun simctl list devices available

      - name: Build the UI test (made with XcodeGen)
        run: |
          set -o pipefail
          which xcodegen || brew install xcodegen
          cd apps/mobile/ios/PlayTest
          xcodegen generate
          xcodebuild build-for-testing -project PlayTest.xcodeproj -scheme PlayTest \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/playtest" 2>&1 | tail -n 40

      - name: Build the app content and sync Capacitor
        run: pnpm ios:sync

      - name: Build the app for the simulator (Release)
        run: |
          set -o pipefail
          xcodebuild -project "$PROJECT" -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO build | tail -n 15

      - name: Build the app for the simulator (Debug)
        run: |
          set -o pipefail
          xcodebuild -project "$PROJECT" -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO build | tail -n 15

      - name: Play by taps in the simulator
        timeout-minutes: 38
        run: apps/mobile/ios/PlayTest/play.sh "${{ matrix.sim }}" "${{ matrix.label }}" "${{ matrix.mode }}" "${{ matrix.levels }}" "${{ matrix.quality_tap }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-play-${{ matrix.label }}
          path: |
            out/*/shots
            out/*/console.txt
            out/*/unified.txt
            out/*/xcodebuild.log
          if-no-files-found: warn

      - name: Did the taps win level 1?
        if: always()
        run: |
          [ "$(cat out/*/status 2> /dev/null)" = "0" ] || { echo "level 1 was not won by taps"; exit 1; }
