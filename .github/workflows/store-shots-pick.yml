name: Store screenshots, picked frames (test only)

# TEST ONLY, not for merging. Copies the full-size pictures named in shoot-pick.txt out of store screenshot runs'
# own artifacts and commits them to this test branch, so they can be fetched with git.
# shoot-pick.txt: one line per picture: <run id> <label> <folder, e.g. xc/01-river> <frame, e.g. 02> <new name>

on:
  push:
    branches: [store-screenshots-shot7]
    paths: ['shoot-pick.txt']

permissions:
  contents: write
  actions: read

jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the runs' pictures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '{print $1, $2}' shoot-pick.txt | sort -u | while read -r run label; do
            [ -n "$run" ] || continue
            mkdir -p "all/$run/$label"
            gh run download "$run" -R "$GITHUB_REPOSITORY" -n "store-shots-$label" -D "all/$run/$label"
          done
          find all -maxdepth 3 | head -n 40
      - name: Copy the picked pictures
        run: |
          rm -rf store-shots
          while read -r run label folder frame name; do
            [ -n "$run" ] || continue
            mkdir -p "store-shots/$label"
            cp "all/$run/$label/$folder/$frame.png" "store-shots/$label/$name.png"
            sha256sum "store-shots/$label/$name.png"
          done < shoot-pick.txt
      - name: Commit them to this test branch
        run: |
          git config user.name "store-shots test"
          git config user.email "store-shots-test@users.noreply.github.com"
          git add -A store-shots
          git commit -m "TEST ONLY: picked store screenshots" || exit 0
          for i in 1 2 3; do git pull --rebase origin store-screenshots-shot7 && git push origin HEAD:store-screenshots-shot7 && break; sleep 5; done
