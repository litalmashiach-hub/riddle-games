name: Progress backup in the simulator (test only)

# TEST ONLY, not for merging. Builds the iPhone app unsigned for the simulator on a hosted Mac, wins
# levels 1 and 2 inside it by real touches, ends it, deletes the web view's localStorage files, starts it
# again and reads what came back; then Reset progress, the same wipe, and a last start
# (e2e/app/quit.ts and ios-wipe.sh). No signing, no secrets.

on:
  push:
    branches: ['progress-backup-mac-test']

permissions:
  contents: read

concurrency:
  group: progress-backup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Xcode and Mac
        run: |
          xcodebuild -version; sw_vers; sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep -E "iPhone|iPad"
      - name: App content with the test hooks, synced into the iOS project
        run: |
          VITE_APP_TEST_HOOKS=1 pnpm build:app
          npm --prefix e2e/app install --no-audit --no-fund
          e2e/app/node_modules/.bin/tsx e2e/app/prepare-app-build.ts
          CAP_TEST_INSPECTABLE=1 pnpm --filter @riddle/mobile exec cap sync ios
          cat apps/mobile/ios/App/App/capacitor.config.json
      - name: Build the app for the simulator (Release)
        run: |
          set -o pipefail
          xcodebuild -project apps/mobile/ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build | tail -n 20
          tar -czf app.tgz -C build/ios/Build/Products/Release-iphonesimulator App.app
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: app.tgz

  quit:
    needs: build
    name: ${{ matrix.label }}
    runs-on: macos-26
    timeout-minutes: 110
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: iphone, sim: 'iPhone 17 Pro Max', orientation: '-', flags: 'fps=6' }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: app
      - name: Runner, Appium and its iOS driver
        run: |
          mkdir -p build/ios/Build/Products/Release-iphonesimulator
          tar -xzf app.tgz -C build/ios/Build/Products/Release-iphonesimulator
          npm --prefix e2e/app install --no-audit --no-fund
          export APPIUM_HOME="$PWD/e2e/app/.appium"
          e2e/app/node_modules/.bin/appium driver install xcuitest@12.22.8
      - name: Play, wipe the web storage and relaunch in the simulator
        timeout-minutes: 95
        run: e2e/app/ios-wipe.sh "${{ matrix.label }}" "${{ matrix.sim }}" "${{ matrix.orientation }}" "${{ matrix.flags }}"
      - name: The run's log and what the app's folder held
        if: always()
        run: |
          cat out/*/run-log.txt || true
          cat out/*/app-folder.txt || true
      - name: Keep the results on the branch progress-backup-out-${{ matrix.label }}-mac-test (test only, overwritten each run)
        if: always()
        run: |
          cd out
          rm -rf */shots
          git init -q -b results
          git config user.name "progress-backup run"
          git config user.email "actions@users.noreply.github.com"
          echo "Run ${{ github.run_id }}, job ${{ matrix.label }}, commit ${{ github.sha }}" > RUN.txt
          git add -A
          git commit -q -m "TEST ONLY: progress-backup results of run ${{ github.run_id }}, ${{ matrix.label }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "results:refs/heads/progress-backup-out-${{ matrix.label }}-mac-test"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: progress-backup-${{ matrix.label }}
          path: out/
          if-no-files-found: warn
