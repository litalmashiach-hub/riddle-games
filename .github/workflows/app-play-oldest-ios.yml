name: App play on the oldest iOS (test only)

# TEST ONLY, not for merging. The app allows iOS/iPadOS 15.0 and up (IPHONEOS_DEPLOYMENT_TARGET).
# Step 1: which iOS simulator systems the hosted Macs carry, and whether an iOS 15 one can be added.

on:
  push:
    branches: ['test/app-play-oldest-ios']

permissions:
  contents: read

jobs:
  runtimes:
    name: runtimes ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
    steps:
      - name: What is on this Mac
        run: |
          sw_vers; sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize; df -h / | tail -1
          ls -d /Applications/Xcode* ; xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep -E "iPhone|iPad"
          which xcodes && xcodes version || true
      - name: Runtimes xcodes can fetch
        continue-on-error: true
        run: xcodes runtimes 2>&1 | grep -E "iOS" | head -80
      - name: Try to add iOS 15 by xcodebuild
        continue-on-error: true
        timeout-minutes: 20
        run: |
          for v in 15.5 15.4 15.2 15.0; do
            echo "== xcodebuild -downloadPlatform iOS -buildVersion $v"
            T0=$(date +%s); xcodebuild -downloadPlatform iOS -buildVersion "$v" 2>&1 | tail -n 8 && echo "took $(( $(date +%s) - T0 )) s"
            xcrun simctl list runtimes | grep -q "iOS 15" && break
          done
          xcrun simctl list runtimes
      - name: Try to add iOS 15 by xcodes
        continue-on-error: true
        timeout-minutes: 20
        run: |
          xcrun simctl list runtimes | grep -q "iOS 15" && exit 0
          T0=$(date +%s); sudo xcodes runtimes install "iOS 15.5" 2>&1 | tail -n 20; echo "took $(( $(date +%s) - T0 )) s"
          xcrun simctl list runtimes
      - name: Can a device be made and booted on the oldest runtime
        continue-on-error: true
        timeout-minutes: 10
        run: |
          RT=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['isAvailable'] and x['platform']=='iOS']; r.sort(key=lambda x:[int(n) for n in x['version'].split('.')]); print(r[0]['identifier'] if r else '')")
          echo "oldest available iOS runtime: $RT"
          for N in "iPhone SE (3rd generation)" "iPhone SE (2nd generation)" "iPhone 13" "iPad (9th generation)" "iPad Air (5th generation)" "iPad Pro (12.9-inch) (5th generation)"; do
            T=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys; t=[x['identifier'] for x in json.load(sys.stdin)['devicetypes'] if x['name']=='$N']; print(t[0] if t else '')")
            [ -z "$T" ] && { echo "$N: no such device type"; continue; }
            U=$(xcrun simctl create "t-$N" "$T" "$RT" 2>&1) && echo "$N on $RT: made $U" || echo "$N on $RT: $U"
          done
          U=$(xcrun simctl list devices -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices'].get('$RT',[]); print(d[0]['udid'] if d else '')")
          [ -n "$U" ] && { T0=$(date +%s); xcrun simctl boot "$U"; xcrun simctl bootstatus "$U" -b > /dev/null; echo "booted in $(( $(date +%s) - T0 )) s"; xcrun simctl list devices | grep "$U"; }
