name: Reviewer session (test only)

# TEST ONLY, not for merging. Builds the iPhone/iPad app unsigned for the simulator on a hosted Mac and
# plays one session with it as App Review would (e2e/app/reviewer.ts, ios-reviewer.sh). No signing, no secrets.

on:
  push:
    branches: ['test/reviewer-session-mac-test']

permissions:
  contents: read

concurrency:
  group: reviewer-session-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Xcode and Mac
        run: |
          xcodebuild -version; sw_vers; sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          xcrun simctl list runtimes
      - name: App content with the test hooks, synced into the iOS project
        run: |
          VITE_APP_TEST_HOOKS=1 pnpm build:app
          npm --prefix e2e/app install --no-audit --no-fund
          e2e/app/node_modules/.bin/tsx e2e/app/prepare-app-build.ts
          CAP_TEST_INSPECTABLE=1 pnpm --filter @riddle/mobile exec cap sync ios
      - name: Build the app for the simulator (Release)
        run: |
          set -o pipefail
          xcodebuild -project apps/mobile/ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build | tail -n 20
          tar -czf app.tgz -C build/ios/Build/Products/Release-iphonesimulator App.app
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: app.tgz

  review:
    needs: build
    name: ${{ matrix.label }}
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: iphone, sim: 'iPhone 17 Pro', orientation: '-', flags: '' }
          # The iPad job of run 45836619755 is still going on the first commit; this run is the iPhone again.
          # - { label: ipad, sim: 'iPad Pro 13-inch (M5)', orientation: LANDSCAPE, flags: 'fps=6 sd-first' }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: app
      - name: Runner, Appium and its iOS driver
        run: |
          mkdir -p build/ios/Build/Products/Release-iphonesimulator
          tar -xzf app.tgz -C build/ios/Build/Products/Release-iphonesimulator
          npm --prefix e2e/app install --no-audit --no-fund
          export APPIUM_HOME="$PWD/e2e/app/.appium"
          e2e/app/node_modules/.bin/appium driver install xcuitest@12.22.8
      - name: The reviewer's session in the simulator
        timeout-minutes: 105
        run: e2e/app/ios-reviewer.sh "${{ matrix.label }}" "${{ matrix.sim }}" "${{ matrix.orientation }}" "${{ matrix.flags }}"
      - name: The run's log
        if: always()
        run: cat out/*/run-log.txt || true
      - name: Keep the results on the branch test/reviewer-session-out/${{ matrix.label }} (test only, overwritten each run)
        if: always()
        run: |
          cd out
          rm -rf */shots
          git init -q -b results
          git config user.name "reviewer-session run"
          git config user.email "actions@users.noreply.github.com"
          echo "Run ${{ github.run_id }}, job ${{ matrix.label }}, commit ${{ github.sha }}" > RUN.txt
          git add -A
          git commit -q -m "TEST ONLY: reviewer-session results of run ${{ github.run_id }}, ${{ matrix.label }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "results:refs/heads/test/reviewer-session-out/${{ matrix.label }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewer-${{ matrix.label }}
          path: out/
          if-no-files-found: warn
