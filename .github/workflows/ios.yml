name: iOS build

# Builds the iPhone/iPad app for the simulator on a hosted Mac, unsigned, and screenshots it running.
# No signing, no certificates, no secrets. See docs/ios-app.md.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: apps/mobile/ios/App/App.xcodeproj
  DERIVED: build/ios

jobs:
  simulator:
    # Capacitor 8 needs Xcode 26 or newer.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build the app content and sync Capacitor
        run: pnpm ios:sync

      - name: The app content has no service worker
        run: |
          test -f apps/mobile/ios/App/App/public/index.html
          test ! -e apps/mobile/ios/App/App/public/sw.js
          if grep -rl "sw.js" apps/mobile/ios/App/App/public; then echo "The app content still registers a service worker"; exit 1; fi

      - name: Xcode and simulators on this runner
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Build for the simulator (Debug)
        run: |
          set -o pipefail
          xcodebuild -project "$PROJECT" -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO build | tail -n 60

      - name: Build for the simulator (Release)
        run: |
          set -o pipefail
          xcodebuild -project "$PROJECT" -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO build | tail -n 60

      - name: Check the built app
        run: |
          APP="$DERIVED/Build/Products/Release-iphonesimulator/App.app"
          test -d "$APP"
          plutil -p "$APP/Info.plist"
          # Apple refuses an app icon with an alpha channel.
          ICON=apps/mobile/ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          sips -g pixelWidth -g pixelHeight -g hasAlpha "$ICON"
          sips -g hasAlpha "$ICON" | grep -q "hasAlpha: no"
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" >> "$GITHUB_ENV"

      # TEST ONLY: added on the throwaway branch privacy-manifest-mac-test, not part of the real workflow.
      - name: Privacy manifests in the built app
        run: |
          set -euo pipefail
          test -f "$APP/PrivacyInfo.xcprivacy"
          plutil -lint "$APP/PrivacyInfo.xcprivacy"
          echo "== every privacy manifest in the built app"
          find "$APP" -name PrivacyInfo.xcprivacy | sort | while read -r f; do
            echo "-- ${f#"$APP"/}"
            plutil -p "$f"
          done
          echo "== the app's manifest says: no tracking, nothing else declared"
          test "$(plutil -extract NSPrivacyTracking raw "$APP/PrivacyInfo.xcprivacy")" = "false"
          for k in NSPrivacyTrackingDomains NSPrivacyCollectedDataTypes NSPrivacyAccessedAPITypes; do
            test "$(plutil -extract "$k" raw "$APP/PrivacyInfo.xcprivacy")" = "0"
          done
          echo "== contents of the app bundle, top level and frameworks"
          ls -la "$APP"
          ls -la "$APP/Frameworks" || true
          echo "== required-reason symbols referenced by each binary (information only)"
          for b in "$APP/App" "$APP"/Frameworks/*.framework/*; do
            file "$b" | grep -q "Mach-O" || continue
            echo "-- ${b#"$APP"/}"
            echo "undefined symbols:"
            nm -u "$b" 2>/dev/null | grep -E '_(stat|fstat|lstat|fstatat|getattrlist|getattrlistbulk|fgetattrlist|getattrlistat|statfs|statvfs|fstatfs|fstatvfs|mach_absolute_time)(\$INODE64)?$|NSUserDefaults|UITextInputMode|NSFileCreationDate|NSFileModificationDate|NSFileSystemFreeSize|NSFileSystemSize|NSURLCreationDateKey|NSURLContentModificationDateKey|NSURLVolume' || echo "  none"
            echo "strings:"
            strings -a "$b" | grep -E '^(systemUptime|activeInputModes|standardUserDefaults|fileModificationDate|initWithSuiteName:)$' | sort -u || echo "  none"
          done

      - name: Simulator helper
        run: |
          mkdir -p screenshots
          cat > "$RUNNER_TEMP/shoot.sh" <<'SH'
          #!/bin/bash
          # shoot.sh <simulator name prefix> <file label>: run the app in the newest matching simulator and screenshot it.
          set -euxo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          prefix = sys.argv[1]
          runtimes = json.load(sys.stdin)["devices"]
          for runtime in sorted(runtimes, reverse=True):
              if "iOS" not in runtime: continue
              for d in runtimes[runtime]:
                  if d["name"].startswith(prefix):
                      print(d["udid"]); sys.exit(0)
          ' "$1")"
          if [ -z "$UDID" ]; then echo "No simulator named $1*"; exit 1; fi
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 3
          xcrun simctl io "$UDID" screenshot "screenshots/$2-launch.png"
          # Give the web view time to load the game and draw the level map.
          sleep 40
          xcrun simctl io "$UDID" screenshot "screenshots/$2-level-map.png"
          xcrun simctl shutdown "$UDID"
          SH
          chmod +x "$RUNNER_TEMP/shoot.sh"

      - name: Run in an iPhone simulator and take screenshots
        timeout-minutes: 12
        run: '"$RUNNER_TEMP/shoot.sh" "iPhone 17" iphone'

      - name: Run in an iPad simulator and take screenshots
        if: always()
        timeout-minutes: 12
        run: '"$RUNNER_TEMP/shoot.sh" "iPad" ipad'

      # The full-size screenshots are in the artifact below. These small copies go into the log as text,
      # for readers who can open a run's log but cannot download its artifacts.
      - name: Small previews of the screenshots, in the log
        if: always()
        run: |
          for f in screenshots/*-level-map.png; do
            [ -f "$f" ] || continue
            sips -s format jpeg -s formatOptions 55 -Z 1100 "$f" --out "$RUNNER_TEMP/preview.jpg" >/dev/null
            echo "-----BEGIN PREVIEW $(basename "$f" .png)-----"
            base64 -i "$RUNNER_TEMP/preview.jpg" | fold -w 120
            echo "-----END PREVIEW-----"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-screenshots
          path: screenshots
          if-no-files-found: warn
